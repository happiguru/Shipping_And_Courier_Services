name: Linters

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install LHCI
        run: npm install --no-save @lhci/cli@0.4.x
      - name: Run Lighthouse (LHCI)
        run: npx lhci autorun --upload.target=temporary-public-storage --collect.staticDistDir=.
      - name: Upload LHCI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-report
          path: ./.lighthouseci || .lhci || ./lhci-*.html

  webhint:
    name: Webhint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Ensure .hintrc
        run: |
          [ -f .hintrc ] || wget https://raw.githubusercontent.com/microverseinc/linters-config/master/html-css/.hintrc
      - name: Run webhint (produce JSON)
        run: npx hint --telemetry=off --format=json . > webhint-report.json
      - name: Upload webhint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webhint-report
          path: webhint-report.json

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Ensure .stylelintrc.json
        run: |
          [ -f .stylelintrc.json ] || wget https://raw.githubusercontent.com/microverseinc/linters-config/master/html-css/.stylelintrc.json
      - name: Run stylelint (produce JSON)
        run: npx stylelint "**/*.{css,scss}" --formatter json > stylelint-report.json
      - name: Upload stylelint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stylelint-report
          path: stylelint-report.json
